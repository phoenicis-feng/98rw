{{ define "main" }}
  {{ partial "hero.html" . }}
  <div class="container docs-page">
    <nav class="docs__breadcrumb" aria-label="breadcrumb">
      <a href="{{ site.Home.RelPermalink }}">首页</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">{{ .Title }}</span>
    </nav>
    <section class="section">
      {{- if not .Params.hero }}
        <h1>{{ .Title }}</h1>
      {{- end }}
      {{ .Content }}
    </section>
  </div>
{{ end }}
