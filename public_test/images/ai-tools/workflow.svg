<svg width="800" height="520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="100%" stop-color="#34a853"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="#f8f9fa" rx="12"/>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a1a">
    四大 AI 工具白嫖路線圖
  </text>
  <text x="400" y="60" text-anchor="middle" font-size="13" fill="#666">
    從安裝到免費使用：Gemini、OpenCode、Cline、OpenRouter
  </text>

  <!-- Gemini -->
  <g filter="url(#shadow)">
    <rect x="50" y="100" width="180" height="95" rx="8" fill="url(#grad-blue)"/>
    <text x="140" y="125" text-anchor="middle" font-size="15" font-weight="600" fill="white">Gemini</text>
    <text x="140" y="145" text-anchor="middle" font-size="11" fill="white">Google AI Studio</text>
    <text x="140" y="162" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">網頁版 + Gemini CLI</text>
    <text x="140" y="180" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">每日 1000 免費請求</text>
  </g>

  <!-- OpenCode -->
  <g filter="url(#shadow)">
    <rect x="50" y="240" width="180" height="95" rx="8" fill="url(#grad-purple)"/>
    <text x="140" y="265" text-anchor="middle" font-size="15" font-weight="600" fill="white">OpenCode</text>
    <text x="140" y="285" text-anchor="middle" font-size="11" fill="white">開源 AI 編碼助手</text>
    <text x="140" y="302" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">npm / mise 安裝</text>
    <text x="140" y="320" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">內建免費模型</text>
  </g>

  <!-- Cline -->
  <g filter="url(#shadow)">
    <rect x="570" y="100" width="180" height="95" rx="8" fill="url(#grad-orange)"/>
    <text x="660" y="125" text-anchor="middle" font-size="15" font-weight="600" fill="white">Cline</text>
    <text x="660" y="145" text-anchor="middle" font-size="11" fill="white">VSCode AI 插件</text>
    <text x="660" y="162" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">VSCode 擴展商店</text>
    <text x="660" y="180" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">OpenRouter 對接</text>
  </g>

  <!-- OpenRouter -->
  <g filter="url(#shadow)">
    <rect x="570" y="240" width="180" height="95" rx="8" fill="url(#grad-teal)"/>
    <text x="660" y="265" text-anchor="middle" font-size="15" font-weight="600" fill="white">OpenRouter</text>
    <text x="660" y="285" text-anchor="middle" font-size="11" fill="white">統一 API 平台</text>
    <text x="660" y="302" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">註冊即可獲得 API Key</text>
    <text x="660" y="320" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">400+ 免費模型</text>
  </g>

  <!-- Arrows pointing to OpenRouter (center router) -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#999"/>
    </marker>
  </defs>

  <!-- Arrows from tools to OpenRouter -->
  <line x1="140" y1="200" x2="380" y2="280" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="170" y="225" font-size="10" fill="#999">作為 API 供應商</text>

  <line x1="660" y1="200" x2="530" y2="280" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- Center: OpenRouter as hub -->
  <g filter="url(#shadow)">
    <rect x="330" y="245" width="140" height="70" rx="8" fill="#374159"/>
    <text x="400" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="white">OpenRouter</text>
    <text x="400" y="288" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">多模型聚合平台</text>
  </g>

  <!-- Arrows from Gemini/OpenCode to OpenRouter center -->
  <line x1="240" y1="195" x2="330" y2="265" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="195" x2="470" y2="265" stroke="#999" stroke-width="1.5" marker-end="url(#marker-right)"/>

  <defs>
    <marker id="marker-right" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth" markerTransform="scale(-1,1)">
      <path d="M0,0 L0,6 L9,3 z" fill="#999"/>
    </marker>
  </defs>

  <!-- Legend -->
  <text x="400" y="380" text-anchor="middle" font-size="13" fill="#444">
    實線 = 直接使用 / 灰色虛線 = 可選對接
  </text>

  <g>
    <circle cx="300" cy="400" r="5" fill="#4285f4"/>
    <text x="310" y="405" font-size="12" fill="#444">網頁版 / 本地安裝</text>
    <circle cx="500" cy="400" r="5" fill="#999"/>
    <text x="510" y="405" font-size="12" fill="#666">API 對接</text>
  </g>
</svg>
