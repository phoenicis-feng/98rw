baseURL = 'https://your-site.pages.dev/'
# 生产环境改为真实域名，或在 Cloudflare Pages 设置自定义域名
defaultContentLanguage = 'zh-cn'
locale = 'zh-CN'
title = 'Liftoff 站点'
# 使用 Liftoff 主题
theme = 'liftoff'
# 构建输出目录（Cloudflare Pages 的 Output directory 也填 public）
publishDir = 'public'
# 生成纯静态文件，适合 Cloudflare Pages
disableKinds = ['RSS', 'taxonomy', 'term']

# 构建设置
[build]
  writeStats = false
  useResourceCacheWhenPossible = true

[imaging]
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    quality = 85
  [imaging.avif]
    quality = 85

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark]
    renderer = { unsafe = true }

[params]
  description = "一个 Hugo + Liftoff + Cloudflare Pages 站点"
  author = "作者"

[menus]
  [[menus.main]]
    name = "首页"
    pageRef = "/"
    weight = 5
  [[menus.main]]
    name = "应用场景"
    pageRef = "/recommendations"
    weight = 10
  [[menus.main]]
    name = "openrouter专题"
    pageRef = "/openrouter"
    weight = 15
  [[menus.main]]
    name = "厂商列表"
    pageRef = "/vendors"
    weight = 20

[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup.goldmark.extensions]
  headingID = true
