baseURL = 'https://www.jumohub.com/'
defaultContentLanguage = 'zh-cn'
locale = 'zh-CN'
title = '聚模盒 - AI模型评测、大语言模型对比、免费API、模型薅羊毛'
theme = 'liftoff'
publishDir = 'public'
disableKinds = ['RSS', 'taxonomy', 'term']

[build]
  writeStats = false
  useResourceCacheWhenPossible = true

[imaging]
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    quality = 85
  [imaging.avif]
    quality = 85

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark]
    renderer = { unsafe = true }

[params]
  description = "聚模盒 - 聚合最新AI模型的评测、对比与应用指南。涵盖OpenAI、Anthropic、Google DeepMind、Meta、DeepSeek等主流模型，提供选型建议与实战教程。"
  author = "聚模盒"
  ogImage = "https://www.jumohub.com/images/og-default.png"
  twitterCard = "summary_large_image"
  twitterSite = "@junmohuo"
  keywords = [
    "AI模型",
    "大语言模型",
    "LLM",
    "模型评测",
    "模型对比",
    "模型选型",
    "AI模型排行",
    "免费API",
    "白嫖模型",
    "免费模型",
    "模型薅羊毛",
    "OpenAI",
    "GPT",
    "Claude",
    "Gemini",
    "DeepSeek",
    "Llama",
    "Qwen",
    "ERNIE",
    "Hunyuan",
    "OpenRouter",
    "模型API",
    "API接入",
    "AI教程",
    "模型教程"
  ]

[minify]
  disableXML = true
  [minify.tdewolff.html]
    keepWhitespace = false

[menus]
  [[menus.main]]
    name = "首页"
    pageRef = "/"
    weight = 5
  [[menus.main]]
    name = "薅羊毛教程"
    pageRef = "/haoyang"
    weight = 10
  [[menus.main]]
    name = "应用场景"
    pageRef = "/recommendations"
    weight = 15
  [[menus.main]]
    name = "openrouter专题"
    pageRef = "/openrouter"
    weight = 20
  [[menus.main]]
    name = "模型仓库"
    pageRef = "/models"
    weight = 25

[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup.goldmark.extensions]
  headingID = true
