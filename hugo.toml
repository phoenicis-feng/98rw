baseURL = 'https://www.jumohub.com/'
defaultContentLanguage = 'zh-cn'
locale = 'zh-CN'
title = '聚模盒'
theme = 'liftoff'
publishDir = 'public'
disableKinds = ['RSS', 'taxonomy', 'term']

[build]
  writeStats = false
  useResourceCacheWhenPossible = true

[imaging]
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    quality = 85
  [imaging.avif]
    quality = 85

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark]
    renderer = { unsafe = true }

[params]
  description = "聚模盒 - 大模型排行榜与大模型评测平台，聚合最新AI大模型评分、榜单、推荐与对比。涵盖OpenAI、Anthropic、Google DeepMind、Meta、DeepSeek等主流模型，提供免费模型榜单、选型建议与实战教程。"
  author = "聚模盒"
  ogImage = "https://www.jumohub.com/images/og-default.png"
  logo = "images/logo.png"
  twitterCard = "summary_large_image"
  twitterSite = "@junmohuo"
  keywords = [
    "AI模型",
    "大语言模型",
    "LLM",
    "大模型排行榜",
    "大模型榜单",
    "大模型免费榜单",
    "大模型推荐",
    "大模型评测",
    "大模型评分",
    "模型评测",
    "模型对比",
    "模型选型",
    "AI模型排行",
    "免费API",
    "白嫖模型",
    "免费模型",
    "模型薅羊毛",
    "OpenAI",
    "GPT",
    "Claude",
    "Gemini",
    "DeepSeek",
    "Llama",
    "Qwen",
    "ERNIE",
    "Hunyuan",
    "OpenRouter",
    "模型API",
    "API接入",
    "AI教程",
    "模型教程"
  ]
  [[params.social]]
    icon = "mdi:email"
    name = "Email"
    url = "mailto:phillfeng@gmail.com"

[minify]
  disableXML = true
  [minify.tdewolff.html]
    keepWhitespace = false

[menus]
  [[menus.main]]
    name = "首页"
    pageRef = "/"
    weight = 5
  [[menus.main]]
    name = "排行榜"
    pageRef = "/leaderboards"
    weight = 10
  [[menus.main]]
    name = "综合排行榜"
    pageRef = "/leaderboards/overall"
    weight = 15
  [[menus.main]]
    name = "免费排行榜"
    pageRef = "/leaderboards/free"
    weight = 20
  [[menus.main]]
    name = "模型对比"
    pageRef = "/compare"
    weight = 22
  [[menus.main]]
    name = "应用场景"
    pageRef = "/recommendations"
    weight = 25
  [[menus.main]]
    name = "模型仓库"
    pageRef = "/models"
    weight = 30
  [[menus.main]]
    name = "免费攻略"
    pageRef = "/haoyang"
    weight = 35

[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup.goldmark.extensions]
  headingID = true
