name: Daily Content Pipeline

on:
  schedule:
    # 每天 08:00 UTC (北京时间 16:00)
    - cron: "0 8 * * *"
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python & Hugo
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl hugo
          pip3 install --quiet pyyaml

      - name: Run Pipeline
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/pipeline.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/ .pipeline_tmp/
          git add -A
          git commit -m "Daily AI posts: $(date +%Y-%m-%d)" || echo "Nothing to commit"
          git push origin main

      - name: Deploy to Cloudflare Pages
        if: success()
        run: echo "✅ Cloudflare Pages auto-deploys on push"
