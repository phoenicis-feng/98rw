{{- /*
Brand mark: uses site.Params.logo if set, otherwise falls back to SVG chevrons.
Appears in both header and footer.
*/ -}}
{{- if site.Params.logo -}}
<img class="site-header__brand-mark" src="{{ site.Params.logo | relURL }}" alt="{{ site.Title }}">
{{- else -}}
<svg class="site-header__brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path fill="currentColor" d="M12 2 21 11h-4l-5-5-5 5H3z"/>
  <path fill="var(--color-secondary)" d="M12 12 21 21h-4l-5-5-5 5H3z"/>
</svg>
{{- end -}}
